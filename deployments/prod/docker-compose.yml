services:
  falkdrop-db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER
      - POSTGRES_PASSWORD
      - POSTGRES_DB
    ports:
      - "5433:5432"
    volumes:
      - falkdrop_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  falkdrop-migrate:
    image: ghcr.io/falbru/falkdrop/falkdrop-server:latest
    command: ["/migrate", "up"]
    environment:
      - DATABASE_URL
    depends_on:
      falkdrop-db:
        condition: service_healthy

  falkdrop-server:
    image: ghcr.io/falbru/falkdrop/falkdrop-server:latest
    restart: always
    environment:
      - AWS_ACCESS_KEY_ID
      - AWS_DEFAULT_REGION
      - AWS_SECRET_ACCESS_KEY
      - CORS_ALLOWED_ORIGINS
      - DATABASE_URL
      - KEYCLOAK_CLIENT_ID
      - KEYCLOAK_REALM_URL
      - OBJECTSTORE_PROVIDER
      - S3_BUCKET
    ports:
      - "8082:8082"
    depends_on:
      falkdrop-db:
        condition: service_healthy
      falkdrop-migrate:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy

  falkdrop-webapp:
    image: ghcr.io/falbru/falkdrop/falkdrop-webapp:latest
    restart: always
    environment:
      - VITE_API_URL
    ports:
      - "5173:80"
    depends_on:
      keycloak:
        condition: service_healthy

  keycloak:
    image: quay.io/keycloak/keycloak:26.6.4
    command: start
    environment:
      - KC_HOSTNAME=keycloak.falbru.dev
      - KC_HTTP_ENABLED=true
      - KC_HEALTH_ENABLED=true
      - KC_DB=postgres
      - KC_DB_URL_HOST=keycloak-db
      - KC_DB_USERNAME
      - KC_DB_PASSWORD
      - KC_PROXY=reencrypt
      - KC_PROXY_HEADERS=xforwarded
      - KC_BOOTSTRAP_ADMIN_USERNAME
      - KC_BOOTSTRAP_ADMIN_PASSWORD
    ports:
      - "8080:8080"
    restart: unless-stopped
    volumes:
      - keycloak_data:/opt/keycloak/data/
    healthcheck:
      test:
        - CMD-SHELL
        - |
          set -e
          exec 3<>/dev/tcp/localhost/9000
          echo -e 'GET /health/live HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3
          timeout 2 | grep -E '"status"[[:space:]]*:[[:space:]]*"UP"' <&3
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    depends_on:
      keycloak-db:
        condition: service_healthy

  keycloak-db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_DB=keycloak
      - POSTGRES_USER=${KC_DB_USERNAME}
      - POSTGRES_PASSWORD=${KC_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - keycloak_db_data:/var/lib/postgresql/data/
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${KC_DB_USERNAME} -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  falkdrop_db_data:
  keycloak_data:
  keycloak_db_data:
